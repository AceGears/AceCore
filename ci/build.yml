name: AceCore build

# 1. "app"          – compiles AceCore and runs unit tests (fast; no native runtimes). Run on every push.
# 2. "rgss-natives" – builds the mkxp-z RGSS runtime (Ruby 3.1, SDL2, OpenAL…) with the NDK from a pinned
#                     revision of mkxp-z-android-reworked. Slow (~30–60 min); runs on tags or manual dispatch.
# 3. "full-apk"     – AceCore + RGSS natives = an APK that can run RPG Maker XP/VX/VX Ace & Pokémon Essentials.
#
# GPL note: every APK produced here must be distributed together with this source (incl. the pinned revisions).

on:
  push:
    branches: [ main, master, 'overhaul*' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      build_rgss:
        description: Also build the RGSS (mkxp-z) native runtime and a full APK
        type: boolean
        default: true
      natives_run_id:
        description: Reuse the RGSS natives of an earlier run (run id) instead of rebuilding them
        type: string
        default: ''
      device_tests:
        description: Run the emulator tests
        type: boolean
        default: true

env:
  # Pinned, reviewed revision of https://github.com/BookerRues9/mkxp-z-android-reworked
  MKXPZ_PORT_REPO: BookerRues9/mkxp-z-android-reworked
  MKXPZ_PORT_REF: b668e08cb58edf661d56fd4d396036ac31cd8332
  ANDROID_NDK_VERSION: 23.2.8568313

jobs:
  app:
    name: Build & test AceCore
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Runtime helper tests (Ruby, mock Essentials / RPG Maker games)
        run: ruby app/src/test/ruby/runtime_test.rb
      - name: Compile
        run: chmod +x gradlew ci/run-gradle.sh && GRADLE_LOG=compile.log ci/run-gradle.sh compileDebugKotlin
      - name: Unit tests (JVM + Robolectric)
        run: GRADLE_LOG=test.log ci/run-gradle.sh testDebugUnitTest
      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          rows = []; total = fail = skip = 0
          for f in sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml")):
              r = ET.parse(f).getroot()
              t, fl, sk = int(r.get("tests")), int(r.get("failures")) + int(r.get("errors")), int(r.get("skipped"))
              total += t; fail += fl; skip += sk
              rows.append(f"{r.get('name').split('.')[-1]}: {t} tests, {fl} failed, {sk} skipped")
          print(f"::notice title=Unit tests: {total} run, {fail} failed, {skip} skipped::" + "%0A".join(rows))
          PY
      - name: Assemble debug APK (no native runtimes)
        run: GRADLE_LOG=assemble.log ci/run-gradle.sh assembleDebug
      - name: Upload Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AceCore-web-only-debug
          path: app/build/outputs/apk/debug/*.apk

  rgss-natives:
    name: Build RGSS runtime (mkxp-z, arm64-v8a)
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.build_rgss && inputs.natives_run_id == '')
    runs-on: ubuntu-22.04
    steps:
      - name: Check out pinned mkxp-z Android port
        uses: actions/checkout@v5
        with:
          repository: ${{ env.MKXPZ_PORT_REPO }}
          ref: ${{ env.MKXPZ_PORT_REF }}
          path: port
          submodules: recursive
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Host tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential cmake curl gpg xxd autoconf automake libtool pkg-config python3 git unzip
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.1' }
      - name: Install NDK (runner's preinstalled Android SDK)
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          ANDROID_HOME="$SDK"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          echo "ARCH=linux-x86_64" >> "$GITHUB_ENV"
      - name: Fetch native dependencies
        working-directory: port/app/jni
        run: |
          chmod +x get_deps.sh && ./get_deps.sh
          cd mkxp-z && chmod +x make_xxd.sh && ./make_xxd.sh
      - name: Compile native dependencies (arm64-v8a, 16 KB pages)
        working-directory: port/app/jni
        run: |
          HOST=aarch64-linux-android TARGET=aarch64-linux-android ABI=arm64-v8a \
          LDFLAGS="-Wl,-z,max-page-size=16384" make -j"$(nproc)"
          if [ -d build-arm64-v8a ] && [ ! -d build-arm64 ]; then ln -s build-arm64-v8a build-arm64; fi
      - name: Build port (ndk-build of mkxp-z and libraries)
        working-directory: port
        run: |
          # Only arm64-v8a dependencies were compiled above, so build only that ABI.
          sed -i 's/^APP_ABI.*/APP_ABI := arm64-v8a/' app/jni/Application.mk
          # 16 KB page support (Android 15+ devices with 16 KB pages): the final shared libraries must be linked with
          # 16 KB-aligned LOAD segments; NDK 23 defaults to 4 KB. Checked after the build.
          printf '\nAPP_LDFLAGS += -Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384\n' >> app/jni/Application.mk
          tail -n 5 app/jni/Application.mk
          sed -i "s/include 'arm64-v8a', 'armeabi-v7a'/include 'arm64-v8a'/" app/build.gradle
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon assembleRelease -Pandroid.suppressUnsupportedCompileSdk=34 > ../port-build.log 2>&1
          status=$?
          set -e
          tail -n 60 ../port-build.log
          if [ $status -ne 0 ]; then
            # Surface the real errors as annotations (readable via the API even when raw logs are not).
            grep -nE "error:|Error|FAILED|What went wrong|undefined reference|No such file|cannot find|fatal" ../port-build.log \
              | grep -v "AC_HELP_STRING" | head -60 > ../port-errors.txt || true
            i=0
            while [ $i -lt 9 ]; do
              chunk=$(sed -n "$((i*7+1)),$((i*7+7))p" ../port-errors.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
              [ -n "$chunk" ] && echo "::error title=port build ($i)::$chunk"
              i=$((i+1))
            done
            echo "::error title=port build tail::$(tail -n 25 ../port-build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit $status
          fi
      - name: Extract shared libraries
        run: |
          APK=$(find port/app/build/outputs/apk/release -name '*.apk' | grep -E 'arm64|universal' | head -1)
          [ -n "$APK" ] || APK=$(find port/app/build/outputs/apk/release -name '*.apk' | head -1)
          [ -n "$APK" ] || { echo "No APK produced by the port build"; exit 1; }
          echo "Using $APK"
          mkdir -p natives/arm64-v8a
          unzip -j -o "$APK" 'lib/arm64-v8a/*.so' -d natives/arm64-v8a
          ls -la natives/arm64-v8a
          for lib in SDL2 SDL2_image SDL2_ttf SDL2_sound openal ruby mkxp-z; do
            test -f "natives/arm64-v8a/lib$lib.so" || { echo "missing lib$lib.so"; exit 1; }
          done
          echo "${MKXPZ_PORT_REPO}@${MKXPZ_PORT_REF}" > natives/SOURCE.txt
          # NDK 23's libc++_shared.so is 4 KB-aligned; NDK r27's is 16 KB-aligned and ABI-compatible (same __ndk1 ABI,
          # newer is a superset), so ship that one.
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          "$SDKMANAGER" --install "ndk;27.2.12479018" > /dev/null
          cp "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" natives/arm64-v8a/
          # Unstripped copies, for turning crash-report addresses into function names.
          mkdir -p natives/symbols
          find port/app/build -path '*obj/local/arm64-v8a/*.so' -exec cp {} natives/symbols/ \; || true
          ls -la natives/symbols || true
      - name: Verify 16 KB alignment of every native library
        run: |
          bad=0
          for f in natives/arm64-v8a/*.so; do
            aligns=$(readelf -lW "$f" | awk '/LOAD/{print $NF}')
            echo "$(basename "$f"): $aligns"
            for a in $aligns; do [ $((a)) -ge 16384 ] || bad=1; done
          done
          [ $bad -eq 0 ] || { echo "::error::a native library is not 16 KB-aligned"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: rgss-natives-arm64-v8a
          path: natives/

  full-apk:
    name: AceCore + RGSS runtime APK
    needs: [ app, rgss-natives ]
    if: always() && needs.app.result == 'success' && (needs.rgss-natives.result == 'success' || inputs.natives_run_id != '')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: rgss-natives-arm64-v8a
          path: natives
          run-id: ${{ inputs.natives_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add natives to the app
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp natives/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
          ls -la app/src/main/jniLibs/arm64-v8a
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK (with RGSS runtime)
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AceCore-full-debug-arm64
          path: app/build/outputs/apk/debug/*.apk

  device-tests:
    name: Emulator tests (direct RGSS launch, cheats channel, UI tour)
    needs: [ rgss-natives ]
    if: always() && (needs.rgss-natives.result == 'success' || inputs.natives_run_id != '') && (github.event_name != 'workflow_dispatch' || inputs.device_tests)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: rgss-natives-arm64-v8a
          path: natives
          run-id: ${{ inputs.natives_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add natives to the app
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp natives/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
      - name: Generate the test game
        run: ruby ci/make_test_game.rb app/src/androidTest/assets/tinyxp
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build app and test APKs
        run: chmod +x gradlew ci/run-gradle.sh ci/device-tests.sh && GRADLE_LOG=device-build.log ci/run-gradle.sh assembleDebug assembleDebugAndroidTest -Pacecore.abi=arm64-v8a
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm && echo "::notice title=kvm::$(ls -l /dev/kvm) cpus=$(nproc)"
      - name: Run on emulator (Android 11 x86_64, ARM translation)
        timeout-minutes: 60
        run: EMU_API=30 bash ci/emulator.sh
      - name: Publish results as a pre-release (screenshots, metrics, logs)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -d device-results ] || exit 0
          cd device-results && zip -qr ../device-results.zip . && cd ..
          TAG="device-tests-${{ github.run_id }}"
          gh release create "$TAG" device-results.zip device-results/testresults/*.png --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "Device test results (run ${{ github.run_id }})" --notes "Emulator test output for $GITHUB_SHA" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-results
          path: device-results/
