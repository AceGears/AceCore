name: AceArcade Android

# Jobs (see docs/CI.md):
#   app            compile + unit tests + Ruby runtime tests + debug APK assembly check. Every relevant push/PR (~5 min, Linux).
#   *-natives      game engines (RGSS/mkxp-z, EasyRPG, Godot). Built only on tags or manual dispatch, and then only when
#                  their pinned sources/patches changed: an unchanged engine is restored from the Actions cache.
#   full-apk       app + engines = the APK users install. Tags and manual dispatch.
#   device-tests   emulator tests (Linux + KVM). Manual dispatch (default on) and tags.
#   release        tags v*: AceArcade-vX-Android-arm64.apk + SHA-256 checksums attached to the GitHub Release (idempotent).
#
# GPL note: every APK produced here must be distributed together with this source (incl. the pinned revisions).

on:
  push:
    branches: [ main, master, 'overhaul*' ]
    tags: [ 'v*' ]
    # Changes that cannot affect the Android app don't start a build (path filters are not applied to tag pushes).
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'desktop/**'
      - 'ci/desktop/**'
      - '.github/workflows/desktop.yml'
      - '.github/workflows/publish.yml'
      - '.github/workflows/usage-report.yml'
      - '.github/workflows/artifact-cleanup.yml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/dependabot.yml'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'desktop/**'
      - 'ci/desktop/**'
      - '.github/workflows/desktop.yml'
      - '.github/workflows/publish.yml'
      - '.github/workflows/usage-report.yml'
      - '.github/workflows/artifact-cleanup.yml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/dependabot.yml'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      build_rgss:
        description: Full APK with the RGSS (mkxp-z) runtime; rebuilt only if its sources changed, else cached
        type: boolean
        default: true
      natives_run_id:
        description: Reuse the RGSS engine of an earlier run (run id) - accepted only if built from identical sources
        type: string
        default: ''
      device_tests:
        description: Run the emulator tests
        type: boolean
        default: true
      build_easyrpg:
        description: Include EasyRPG Player (RPG Maker 2000/2003); rebuilt only if its sources changed, else cached
        type: boolean
        default: true
      easyrpg_run_id:
        description: Reuse the EasyRPG engine of an earlier run (run id) - accepted only if built from identical sources
        type: string
        default: ''
      build_godot:
        description: Include the Godot engine library; rebuilt only if its sources changed, else cached
        type: boolean
        default: true
      godot_run_id:
        description: Reuse the Godot engine of an earlier run (run id) - accepted only if built from identical sources
        type: string
        default: ''

# Least privilege: jobs that need more ask for it themselves.
permissions:
  contents: read

# One build per branch/PR: a newer push cancels the superseded one. Tags and manual runs are never cancelled.
concurrency:
  group: android-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) }}

env:
  # Bump to force every engine cache to rebuild (e.g. after changing the build commands below).
  ENGINE_CACHE_VERSION: v1
  # Pinned, reviewed revision of https://github.com/BookerRues9/mkxp-z-android-reworked
  MKXPZ_PORT_REPO: BookerRues9/mkxp-z-android-reworked
  MKXPZ_PORT_REF: b668e08cb58edf661d56fd4d396036ac31cd8332
  ANDROID_NDK_VERSION: 23.2.8568313

jobs:
  app:
    name: Build & test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          # Development happens on branches, not only main: let pushes write the dependency/build cache too.
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Runtime helper tests (Ruby, mock Essentials / RPG Maker games)
        run: ruby app/src/test/ruby/runtime_test.rb && ruby app/src/test/ruby/compat_test.rb && ruby app/src/test/ruby/wininet_test.rb && ruby app/src/test/ruby/tools_test.rb
      - name: Compile
        run: chmod +x gradlew ci/run-gradle.sh && GRADLE_LOG=compile.log ci/run-gradle.sh compileDebugKotlin
      - name: Unit tests (JVM + Robolectric)
        run: GRADLE_LOG=test.log ci/run-gradle.sh testDebugUnitTest
      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          rows = []; total = fail = skip = 0
          for f in sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml")):
              r = ET.parse(f).getroot()
              t, fl, sk = int(r.get("tests")), int(r.get("failures")) + int(r.get("errors")), int(r.get("skipped"))
              total += t; fail += fl; skip += sk
              rows.append(f"{r.get('name').split('.')[-1]}: {t} tests, {fl} failed, {sk} skipped")
          print(f"::notice title=Unit tests: {total} run, {fail} failed, {skip} skipped::" + "%0A".join(rows))
          PY
      - name: Assemble debug APK (no native runtimes)
        run: GRADLE_LOG=assemble.log ci/run-gradle.sh assembleDebug
      - name: Upload test reports (only when a test failed)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          retention-days: 7

  rgss-natives:
    name: Build RGSS runtime (mkxp-z, arm64-v8a)
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.build_rgss)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read   # download a verified earlier build
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out AceArcade (engine patches and reuse check)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: acecore
      # 1) cache hit for these exact sources, 2) a verified earlier run (natives_run_id), 3) build. Never a stale binary.
      - name: Restore the engine built from these sources
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: natives
          key: rgss-natives-${{ env.ENGINE_CACHE_VERSION }}-${{ env.MKXPZ_PORT_REF }}-ndk${{ env.ANDROID_NDK_VERSION }}-${{ hashFiles('acecore/ci/patches/**') }}
      - name: Reuse a verified build, if any
        id: have
        working-directory: acecore
        env:
          ENGINE_PINS: MKXPZ_PORT_REPO MKXPZ_PORT_REF ANDROID_NDK_VERSION
        run: bash ci/engine-reuse.sh RGSS rgss-natives-arm64-v8a "$GITHUB_WORKSPACE/natives" "${{ inputs.natives_run_id }}" ci/patches
      - name: Check out pinned mkxp-z Android port
        if: steps.have.outputs.ok != 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ env.MKXPZ_PORT_REPO }}
          ref: ${{ env.MKXPZ_PORT_REF }}
          path: port
          submodules: recursive
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        if: steps.have.outputs.ok != 'true'
        with: { distribution: temurin, java-version: '17' }
      - name: Host tools
        if: steps.have.outputs.ok != 'true'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential cmake curl gpg xxd autoconf automake libtool pkg-config python3 git unzip
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        if: steps.have.outputs.ok != 'true'
        with: { ruby-version: '3.1' }
      - name: Install NDK (runner's preinstalled Android SDK)
        if: steps.have.outputs.ok != 'true'
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          ANDROID_HOME="$SDK"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          echo "ARCH=linux-x86_64" >> "$GITHUB_ENV"
      - name: Fetch native dependencies
        if: steps.have.outputs.ok != 'true'
        working-directory: port/app/jni
        run: |
          chmod +x get_deps.sh && ./get_deps.sh
          cd mkxp-z && chmod +x make_xxd.sh && ./make_xxd.sh
      - name: Apply AceCore patches to mkxp-z (see ci/patches; each file explains its change)
        if: steps.have.outputs.ok != 'true'
        run: |
          test -f port/app/jni/mkxp-z/src/util/encoding.h
          cp -rv acecore/ci/patches/mkxp-z/. port/app/jni/mkxp-z/
          grep -q "AceCore patch" port/app/jni/mkxp-z/src/util/encoding.h
          python3 acecore/ci/patches/ruby/android_utf8_locale.py port/app/jni/ruby
      - name: Compile native dependencies (arm64-v8a, 16 KB pages)
        if: steps.have.outputs.ok != 'true'
        working-directory: port/app/jni
        run: |
          HOST=aarch64-linux-android TARGET=aarch64-linux-android ABI=arm64-v8a \
          LDFLAGS="-Wl,-z,max-page-size=16384" make -j"$(nproc)"
          if [ -d build-arm64-v8a ] && [ ! -d build-arm64 ]; then ln -s build-arm64-v8a build-arm64; fi
      - name: Build port (ndk-build of mkxp-z and libraries)
        if: steps.have.outputs.ok != 'true'
        working-directory: port
        run: |
          # Only arm64-v8a dependencies were compiled above, so build only that ABI.
          sed -i 's/^APP_ABI.*/APP_ABI := arm64-v8a/' app/jni/Application.mk
          # 16 KB page support (Android 15+ devices with 16 KB pages): the final shared libraries must be linked with
          # 16 KB-aligned LOAD segments; NDK 23 defaults to 4 KB. Checked after the build.
          printf '\nAPP_LDFLAGS += -Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384\n' >> app/jni/Application.mk
          tail -n 5 app/jni/Application.mk
          sed -i "s/include 'arm64-v8a', 'armeabi-v7a'/include 'arm64-v8a'/" app/build.gradle
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon assembleRelease -Pandroid.suppressUnsupportedCompileSdk=34 > ../port-build.log 2>&1
          status=$?
          set -e
          tail -n 60 ../port-build.log
          if [ $status -ne 0 ]; then
            # Surface the real errors as annotations (readable via the API even when raw logs are not).
            grep -nE "error:|Error|FAILED|What went wrong|undefined reference|No such file|cannot find|fatal" ../port-build.log \
              | grep -v "AC_HELP_STRING" | head -60 > ../port-errors.txt || true
            i=0
            while [ $i -lt 9 ]; do
              chunk=$(sed -n "$((i*7+1)),$((i*7+7))p" ../port-errors.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
              [ -n "$chunk" ] && echo "::error title=port build ($i)::$chunk"
              i=$((i+1))
            done
            echo "::error title=port build tail::$(tail -n 25 ../port-build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit $status
          fi
      - name: Extract shared libraries
        if: steps.have.outputs.ok != 'true'
        run: |
          APK=$(find port/app/build/outputs/apk/release -name '*.apk' | grep -E 'arm64|universal' | head -1)
          [ -n "$APK" ] || APK=$(find port/app/build/outputs/apk/release -name '*.apk' | head -1)
          [ -n "$APK" ] || { echo "No APK produced by the port build"; exit 1; }
          echo "Using $APK"
          mkdir -p natives/arm64-v8a
          unzip -j -o "$APK" 'lib/arm64-v8a/*.so' -d natives/arm64-v8a
          ls -la natives/arm64-v8a
          for lib in SDL2 SDL2_image SDL2_ttf SDL2_sound openal ruby mkxp-z; do
            test -f "natives/arm64-v8a/lib$lib.so" || { echo "missing lib$lib.so"; exit 1; }
          done
          echo "${MKXPZ_PORT_REPO}@${MKXPZ_PORT_REF}" > natives/SOURCE.txt
          # NDK 23's libc++_shared.so is 4 KB-aligned; NDK r27's is 16 KB-aligned and ABI-compatible (same __ndk1 ABI,
          # newer is a superset), so ship that one.
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          "$SDKMANAGER" --install "ndk;27.2.12479018" > /dev/null
          cp "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" natives/arm64-v8a/
          # Unstripped copies, for turning crash-report addresses into function names.
          mkdir -p natives/symbols
          find port/app/build -path '*obj/local/arm64-v8a/*.so' -exec cp {} natives/symbols/ \; || true
          ls -la natives/symbols || true
      - name: Verify 16 KB alignment of every native library
        if: steps.have.outputs.ok != 'true'
        run: |
          bad=0
          for f in natives/arm64-v8a/*.so; do
            aligns=$(readelf -lW "$f" | awk '/LOAD/{print $NF}')
            ok=1; for a in $aligns; do [ $((a)) -ge 16384 ] || ok=0; done
            [ $ok -eq 1 ] || { bad=1; echo "::warning title=4 KB-aligned library::$(basename "$f"): $(echo $aligns)"; }
            echo "$(basename "$f"): $aligns"
          done
          # Not fatal yet: 4 KB-aligned libraries still load on 4 KB devices and in Android's 16 KB compatibility mode.
          [ $bad -eq 0 ] || echo "::warning::some native libraries are not 16 KB-aligned (listed above)"
      - name: Remember this engine build for unchanged sources
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: natives
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rgss-natives-arm64-v8a
          path: natives/
          retention-days: 90   # reusable by run id (natives_run_id)

  easyrpg-natives:
    name: Build EasyRPG Player (RPG Maker 2000/2003, arm64-v8a)
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.build_easyrpg)
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Restore the engine built from these sources
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: easyrpg-natives
          key: easyrpg-natives-${{ env.ENGINE_CACHE_VERSION }}-${{ hashFiles('ci/easyrpg/**') }}
      - name: Reuse a verified build, if any
        id: have
        run: bash ci/engine-reuse.sh EasyRPG easyrpg-natives-arm64-v8a "$GITHUB_WORKSPACE/easyrpg-natives" "${{ inputs.easyrpg_run_id }}" ci/easyrpg
      - name: Build tools
        if: steps.have.outputs.ok != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build meson autoconf automake libtool pkg-config python3 > /dev/null
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.have.outputs.ok != 'true'
        with:
          path: easyrpg-build/buildscripts/android/arm64-v8a-toolchain
          key: easyrpg-deps-${{ hashFiles('ci/easyrpg/build.sh') }}
      - name: Build (dependencies, SDL3 relocated, EasyRPG Player)
        if: steps.have.outputs.ok != 'true'
        timeout-minutes: 150
        run: bash ci/easyrpg/build.sh easyrpg-natives
      - name: Remember this engine build for unchanged sources
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: easyrpg-natives
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: easyrpg-natives-arm64-v8a
          path: easyrpg-natives/
          retention-days: 90   # reusable by run id

  godot-natives:
    name: Build Godot engine library (arm64-v8a, --main-pack allowed)
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.build_godot)
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Restore the engine built from these sources
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: godot-natives
          key: godot-natives-${{ env.ENGINE_CACHE_VERSION }}-${{ hashFiles('ci/godot/**') }}
      - name: Reuse a verified build, if any
        id: have
        run: bash ci/engine-reuse.sh Godot godot-natives-arm64-v8a "$GITHUB_WORKSPACE/godot-natives" "${{ inputs.godot_run_id }}" ci/godot
      - name: Build
        if: steps.have.outputs.ok != 'true'
        timeout-minutes: 150
        run: bash ci/godot/build.sh godot-natives
      - name: Remember this engine build for unchanged sources
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: godot-natives
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: godot-natives-arm64-v8a
          path: godot-natives/
          retention-days: 90   # reusable by run id

  full-apk:
    name: Android APK (all engines)
    needs: [ app, rgss-natives, easyrpg-natives, godot-natives ]
    if: always() && needs.app.result == 'success' && needs.rgss-natives.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.apk.outputs.version }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rgss-natives-arm64-v8a
          path: natives
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add natives to the app
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp natives/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
          ls -la app/src/main/jniLibs/arm64-v8a
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.easyrpg-natives.result == 'success'
        continue-on-error: true
        with:
          name: easyrpg-natives-arm64-v8a
          path: easyrpg-natives
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add EasyRPG natives (when built)
        run: |
          if ls easyrpg-natives/*.so > /dev/null 2>&1; then
            cp easyrpg-natives/*.so app/src/main/jniLibs/arm64-v8a/
            echo "::notice title=EasyRPG::$(cat easyrpg-natives/EASYRPG_VERSION.txt)"
          else
            echo "::notice title=EasyRPG::not included in this APK"
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.godot-natives.result == 'success'
        continue-on-error: true
        with:
          name: godot-natives-arm64-v8a
          path: godot-natives
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add the Godot engine library (when built)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          if [ -f godot-natives/libgodot_android.so ]; then
            cp godot-natives/libgodot_android.so app/src/main/jniLibs/arm64-v8a/
            echo "::notice title=Godot::$(cat godot-natives/GODOT_VERSION.txt)"
          else
            echo "::warning title=Godot::engine library not rebuilt; the Maven one refuses --main-pack, so Godot games won't start"
          fi
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          # Development happens on branches, not only main: let pushes write the dependency/build cache too.
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Export the Godot engine-test game into the app (official Godot 4.7 editor, headless)
        continue-on-error: true
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q godot.zip -d godot-bin
          G=$(find godot-bin -maxdepth 2 -type f -name 'Godot_v4.7-stable_linux*' | head -1); chmod +x "$G"
          "$G" --headless --path ci/godot-test --import > /dev/null 2>&1 || true
          mkdir -p app/src/main/assets/selftest/godot
          "$G" --headless --path ci/godot-test --export-pack "Windows Desktop" "$PWD/app/src/main/assets/selftest/godot/SelfTest.pck" > /dev/null 2>&1 || true
          if head -c 4 app/src/main/assets/selftest/godot/SelfTest.pck 2>/dev/null | grep -q GDPC; then echo "::notice title=Godot engine test::included"
          else rm -rf app/src/main/assets/selftest/godot; echo "::warning title=Godot engine test::not included (export failed)"; fi
      - name: Assemble debug APK (all engines)
        id: apk
        run: |
          chmod +x gradlew && ./gradlew --no-daemon assembleDebug -Pacecore.abi=arm64-v8a
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          unzip -p "$APK" lib/arm64-v8a/libgodot_android.so | strings | grep -q "compiled without support for path overrides" \
            && echo "::warning title=Godot::the APK's Godot library refuses --main-pack" || echo "::notice title=Godot::APK's Godot library accepts --main-pack"
          V=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          mkdir -p dist && cp "$APK" "dist/AceArcade-v$V-Android-arm64-debug.apk"
          ( cd dist && sha256sum *.apk > "AceArcade-v$V-Android-checksums.sha256" )
          # Engines inside the APK, for the summary and the release check.
          for l in mkxp-z ruby easyrpg_android SDL3 godot_android; do
            unzip -l "$APK" "lib/arm64-v8a/lib$l.so" > /dev/null 2>&1 && echo "lib$l.so: yes" || echo "lib$l.so: MISSING"
          done | tee engines.txt
          { echo "### AceArcade v$V (Android, arm64)"; echo; echo '```'; cat engines.txt; echo '```'; echo "APK: $(du -h "$APK" | cut -f1)"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Production builds must contain every engine
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if grep -q MISSING engines.txt; then echo "::error title=Release blocked::engine libraries missing: $(grep MISSING engines.txt | tr '\n' ' ')"; exit 1; fi
          V=${{ steps.apk.outputs.version }}; T=${GITHUB_REF_NAME#v}
          [ "$T" = "$V" ] || { echo "::error title=Release blocked::tag $GITHUB_REF_NAME does not match versionName $V in app/build.gradle.kts"; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AceArcade-Android-arm64
          path: dist/
          retention-days: 30

  device-tests:
    name: Emulator tests (RGSS, EasyRPG, Godot, UI tour)
    needs: [ rgss-natives, easyrpg-natives, godot-natives ]
    timeout-minutes: 150
    if: always() && needs.rgss-natives.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.device_tests)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rgss-natives-arm64-v8a
          path: natives
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add natives to the app
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp natives/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.easyrpg-natives.result == 'success'
        continue-on-error: true
        with:
          name: easyrpg-natives-arm64-v8a
          path: easyrpg-natives
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add EasyRPG natives and its test game (EasyRPG TestGame, GPL-3.0)
        run: |
          if ls easyrpg-natives/*.so > /dev/null 2>&1; then
            cp easyrpg-natives/*.so app/src/main/jniLibs/arm64-v8a/
            git init -q tg && git -C tg remote add origin https://github.com/EasyRPG/TestGame.git
            git -C tg fetch -q --depth 1 origin 4bbedb73492c80b79d8290e0b06ea86875b0bdc8 && git -C tg checkout -q FETCH_HEAD
            mkdir -p app/src/androidTest/assets/easyrpg && cp -r tg/TestGame-2000 app/src/androidTest/assets/easyrpg/
          fi
      - name: Generate the test game
        run: ruby ci/make_test_game.rb app/src/androidTest/assets/tinyxp
      - name: Export the Godot test game (official Godot 4.7 editor, headless)
        continue-on-error: true
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q godot.zip -d godot-bin
          G=$(find godot-bin -maxdepth 2 -type f -name 'Godot_v4.7-stable_linux*' | head -1)
          echo "Godot editor: $G"
          chmod +x "$G"
          "$G" --headless --path ci/godot-test --import 2>&1 | tail -n 20 || true
          mkdir -p app/src/androidTest/assets/godot
          "$G" --headless --path ci/godot-test --export-pack "Windows Desktop" "$PWD/app/src/androidTest/assets/godot/TestGame.pck" 2>&1 | tail -n 30 || true
          ls -la app/src/androidTest/assets/godot
          if head -c 4 app/src/androidTest/assets/godot/TestGame.pck 2>/dev/null | grep -q GDPC; then
            echo "::notice title=godot test pack::$(stat -c %s app/src/androidTest/assets/godot/TestGame.pck) bytes"
          else
            echo "::error title=godot test pack::export failed"; rm -f app/src/androidTest/assets/godot/TestGame.pck
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.godot-natives.result == 'success'
        continue-on-error: true
        with:
          name: godot-natives-arm64-v8a
          path: godot-natives
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add the Godot engine library (when built)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          if [ -f godot-natives/libgodot_android.so ]; then
            cp godot-natives/libgodot_android.so app/src/main/jniLibs/arm64-v8a/
            echo "::notice title=Godot::$(cat godot-natives/GODOT_VERSION.txt)"
          else
            echo "::warning title=Godot::engine library not rebuilt; the Maven one refuses --main-pack, so Godot games won't start"
          fi
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          # Development happens on branches, not only main: let pushes write the dependency/build cache too.
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Build app and test APKs
        run: chmod +x gradlew ci/run-gradle.sh ci/device-tests.sh && GRADLE_LOG=device-build.log ci/run-gradle.sh assembleDebug assembleDebugAndroidTest -Pacecore.abi=arm64-v8a
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm && echo "::notice title=kvm::$(ls -l /dev/kvm) cpus=$(nproc)"
      - name: Run on emulator (Android 11 x86_64, ARM translation)
        timeout-minutes: 100
        run: EMU_API=30 bash ci/emulator.sh
      - name: Publish results as a pre-release (screenshots, metrics, logs)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -d device-results ] || exit 0
          cd device-results && zip -qr ../device-results.zip . && cd ..
          TAG="device-tests-${{ github.run_id }}"
          gh release create "$TAG" device-results.zip device-results/testresults/*.png --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "Device test results (run ${{ github.run_id }})" --notes "Emulator test output for $GITHUB_SHA" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: device-results
          path: device-results/
          retention-days: 14

  release:
    name: Publish GitHub Release (tags)
    needs: [ full-apk, device-tests ]
    # Tests must pass (or be skipped by input); a failed or missing APK blocks the release.
    if: always() && startsWith(github.ref, 'refs/tags/') && needs.full-apk.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.device-tests.result)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { sparse-checkout: ci }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: AceArcade-Android-arm64, path: dist }
      - name: Verify checksums
        run: cd dist && sha256sum -c *.sha256
      - name: Create or update the release (idempotent; safe to re-run)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: bash ci/release-publish.sh "$TAG" "AceArcade $TAG" dist/*
