name: Symbolize a native crash

# Turns "AceArcade native backtrace" lines from a crash report into function names and source lines, using the
# unstripped engine libraries (natives/symbols) kept with an RGSS engine build. Linux only, ~1 minute.
# Also runs on a push to a "symbolize-*" branch, reading the run id (first line) and frames (other lines,
# "lib offset") from ci/symbolize-request.txt (new workflows can only be started by hand from the default branch).
on:
  push:
    branches: [ 'symbolize-*' ]
    paths: [ ci/symbolize-request.txt ]
  workflow_dispatch:
    inputs:
      run_id:
        description: Run whose rgss-natives-arm64-v8a artifact matches the APK that crashed
        required: true
      frames:
        description: 'Frames as "lib offset" pairs separated by commas, e.g. "libruby.so 0x758ba4, libruby.so 0x634020"'
        required: true

permissions:
  contents: read
  actions: read

jobs:
  symbolize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: github.event_name == 'push'
        with: { sparse-checkout: ci }
      - name: Inputs
        id: in
        env:
          RUN_ID: ${{ inputs.run_id }}
          FRAMES: ${{ inputs.frames }}
        run: |
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(head -1 ci/symbolize-request.txt)
            FRAMES=$(tail -n +2 ci/symbolize-request.txt | paste -sd,)
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          { echo 'frames<<EOF'; echo "$FRAMES"; echo EOF; } >> "$GITHUB_OUTPUT"
      - name: Download the engine build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download "${{ steps.in.outputs.run_id }}" --repo "$GITHUB_REPOSITORY" -n rgss-natives-arm64-v8a -D natives
      - name: Symbolize
        env:
          FRAMES: ${{ steps.in.outputs.frames }}
        run: |
          SYM="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-symbolizer"
          [ -x "$SYM" ] || SYM=$(ls "$ANDROID_HOME"/ndk/*/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-symbolizer | tail -1)
          ls -la natives/symbols
          echo "$FRAMES" | tr ',' '\n' | while read -r lib off; do
            [ -n "$lib" ] || continue
            f="natives/symbols/$lib"; [ -f "$f" ] || f="natives/arm64-v8a/$lib"
            out=$("$SYM" --obj="$f" --functions=linkage --inlining --demangle "$off" | paste -sd' ')
            echo "$lib $off -> $out"
            echo "$lib $off -> $out" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=$lib $off::$out"
          done
