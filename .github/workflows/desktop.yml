name: AceArcade desktop (Windows, macOS)

# Builds the desktop app (desktop/) and its installers, with the engines AceArcade bundles:
#   Windows: EasyRPG Player (RPG Maker 2000/2003), Ruffle (Flash)
#   macOS:   EasyRPG Player, Ruffle, Godot 4.7 (Godot games exported for Windows, from their .pck), mkxp-z (RPG Maker XP/VX/Ace)
# Games that ship their own Windows program (RPG Maker XP/VX/Ace Game.exe, MV/MZ, Ren'Py, Unity…) run natively on Windows.
on:
  push:
    branches: [ main, master, 'overhaul*' ]
    paths: [ 'desktop/**', 'ci/desktop/**', 'app/src/main/java/com/acecore/app/core/detection/**', 'app/src/main/java/com/acecore/app/core/model/**', '.github/workflows/desktop.yml' ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Publish the zips as a pre-release with this tag (empty = artifacts only)
        type: string
        default: ''

env:
  EASYRPG_VERSION: 0.8.1.1
  MKXPZ_COMMIT: 37a04d14413454551a7b6aadbb4e93e67168accb
  GODOT_VERSION: 4.7-stable

jobs:
  test:
    name: Desktop unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        run: chmod +x gradlew ci/run-gradle.sh && GRADLE_LOG=desktop-test.log ci/run-gradle.sh :desktop:test
      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in sorted(glob.glob("desktop/build/test-results/test/*.xml")):
              r = ET.parse(f).getroot()
              print(f"::notice title={r.get('name').split('.')[-1]}::{r.get('tests')} tests, {int(r.get('failures'))+int(r.get('errors'))} failed")
              for tc in r.iter('testcase'):
                  for fl in list(tc.findall('failure')) + list(tc.findall('error')):
                      print(f"::error title={tc.get('name')}::{(fl.get('message') or '')[:300]}")
          PY

  windows:
    name: Windows portable zip
    needs: test
    runs-on: windows-latest
    env:
      AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Bundle engines (EasyRPG Player, Ruffle)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          R=desktop/resources/windows/runtimes
          mkdir -p $R/easyrpg $R/ruffle
          curl -sSL -o easyrpg.zip "https://easyrpg.org/downloads/player/$EASYRPG_VERSION/easyrpg-player-$EASYRPG_VERSION-windows-x64.zip"
          unzip -q easyrpg.zip -d $R/easyrpg
          A=$(gh release view --repo ruffle-rs/ruffle --json assets -q '.assets[].name' | grep -i 'windows-x86_64.zip$' | head -1)
          gh release download --repo ruffle-rs/ruffle --pattern "$A" --output ruffle.zip
          unzip -q ruffle.zip -d $R/ruffle
          echo "::notice title=engines::EasyRPG $EASYRPG_VERSION, $A"
          find $R -maxdepth 3 -iname '*.exe' | head
      - name: Engine launch tests (EasyRPG, Ruffle)
        continue-on-error: true
        shell: bash
        run: bash ci/desktop/engine-launch-tests.sh windows "$PWD/desktop/resources/windows/runtimes" "$RUNNER_TEMP/enginetest"
      - name: Build portable app
        shell: bash
        run: |
          set -e
          GRADLE_LOG=win.log bash ci/run-gradle.sh :desktop:createDistributable
          ls desktop/build/compose/binaries/main/app/AceArcade
          test -f desktop/build/compose/binaries/main/app/AceArcade/AceArcade.exe
      # Optional: Microsoft's Azure Trusted Signing (gains SmartScreen reputation fastest).
      - name: Sign with Azure Trusted Signing
        if: env.AZURE_SIGNING_ACCOUNT != ''
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: desktop/build/compose/binaries/main/app/AceArcade
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Sign and zip
        shell: bash
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          SIGNED_BY_AZURE: ${{ env.AZURE_SIGNING_ACCOUNT != '' && '1' || '' }}
        run: |
          set -e
          V=$(grep -m1 'appVersion *=' desktop/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          mkdir -p dist
          bash ci/desktop/windows-sign.sh desktop/build/compose/binaries/main/app/AceArcade "$GITHUB_WORKSPACE/dist/AceArcade-$V-windows-x64.zip"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: AceArcade-windows
          path: dist/*.zip

  mkxpz-macos:
    name: mkxp-z engine (macOS, RPG Maker XP/VX/Ace)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - id: cache
        uses: actions/cache@v4
        with:
          path: mkxpz-out
          key: mkxpz-macos-arm64-${{ env.MKXPZ_COMMIT }}-${{ hashFiles('ci/desktop/build-mkxpz-macos.sh') }}
      - name: Build mkxp-z
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash ci/desktop/build-mkxpz-macos.sh "$PWD/mkxpz-out"
      - name: Save the engine build (even if the launch test fails)
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: mkxpz-out
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Launch test (runs a generated RPG Maker XP game)
        run: |
          EXE=$(ls "$PWD"/mkxpz-out/mkxp-z.* | grep -v '\.txt$' | head -1)
          echo "::notice title=mkxp-z::$(cat mkxpz-out/ACEARCADE-BUILD.txt)"
          bash ci/desktop/mkxpz-launch-test.sh "$EXE" "$RUNNER_TEMP"
      - name: Pack (keeps file permissions)
        run: tar -czf mkxpz-macos.tar.gz -C mkxpz-out .
      - uses: actions/upload-artifact@v4
        with:
          name: mkxpz-macos
          path: mkxpz-macos.tar.gz

  macos:
    name: macOS portable zip
    needs: [ test, mkxpz-macos ]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with: { name: mkxpz-macos }
      - name: Bundle engines (EasyRPG Player, Ruffle, Godot, mkxp-z)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          R=desktop/resources/macos/runtimes
          mkdir -p $R/easyrpg $R/ruffle $R/godot $R/mkxpz
          tar -xzf mkxpz-macos.tar.gz -C $R/mkxpz
          curl -sSL -o easyrpg.zip "https://easyrpg.org/downloads/player/$EASYRPG_VERSION/easyrpg-player-$EASYRPG_VERSION-macos.app.zip"
          ditto -x -k easyrpg.zip $R/easyrpg
          A=$(gh release view --repo ruffle-rs/ruffle --json assets -q '.assets[].name' | grep -i 'macos-universal.tar.gz$' | head -1)
          gh release download --repo ruffle-rs/ruffle --pattern "$A" --output ruffle.tar.gz
          tar -xzf ruffle.tar.gz -C $R/ruffle
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION/Godot_v${GODOT_VERSION}_macos.universal.zip"
          ditto -x -k godot.zip $R/godot
          echo "::notice title=engines::EasyRPG $EASYRPG_VERSION, $A, Godot $GODOT_VERSION, mkxp-z ${MKXPZ_COMMIT:0:7}"
          ls -la $R/*
      - name: Engine launch tests (EasyRPG, Godot, Ruffle)
        continue-on-error: true
        run: bash ci/desktop/engine-launch-tests.sh macos "$PWD/desktop/resources/macos/runtimes" "$RUNNER_TEMP/enginetest"
      - name: Build, sign, notarize and zip
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -e
          chmod +x gradlew && GRADLE_LOG=mac.log bash ci/run-gradle.sh :desktop:createDistributable
          D=desktop/build/compose/binaries/main/app
          test -x $D/AceArcade.app/Contents/MacOS/AceArcade
          V=$(grep -m1 'appVersion *=' desktop/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          mkdir -p dist
          bash ci/desktop/macos-sign.sh $D/AceArcade.app "$PWD/dist/AceArcade-$V-macos-$(uname -m).zip"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: AceArcade-macos
          path: dist/*.zip

  publish:
    name: Publish zips
    needs: [ windows, macos ]
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Create pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find dist -type f -exec ls -l {} \;
          FILES=$(find dist -type f -name '*.zip')
          [ -n "$FILES" ] || { echo "::error title=publish::no zips were downloaded"; exit 1; }
          for attempt in 1 2 3; do
            if gh release view "${{ inputs.release_tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              out=$(gh release upload "${{ inputs.release_tag }}" $FILES --clobber --repo "$GITHUB_REPOSITORY" 2>&1) && break
            else
              out=$(gh release create "${{ inputs.release_tag }}" $FILES --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
                --title "AceArcade desktop ${{ inputs.release_tag }}" \
                --notes "Portable Windows and macOS apps (unzip and run, no installer) built from $GITHUB_SHA." 2>&1) && break
            fi
            echo "::warning title=publish attempt $attempt::$(echo "$out" | tail -c 400 | tr '\n' ' ')"
            [ $attempt = 3 ] && { echo "::error title=publish::$(echo "$out" | tail -c 600 | tr '\n' ' ')"; exit 1; }
            sleep 20
          done
          echo "::notice title=published::$(gh release view "${{ inputs.release_tag }}" --repo "$GITHUB_REPOSITORY" --json assets -q '[.assets[]|.name+" "+(.size|tostring)]|join(", ")')"
