name: AceArcade desktop (Windows, macOS)

# Cost model (docs/CI.md): Windows minutes cost ~1.7x and macOS ~10x Linux minutes.
#   push to a branch (desktop sources changed)  -> unit tests only (Linux)
#   manual dispatch / tag desktop-v*             -> Windows and/or macOS zips (+ release when a tag is given)
# The mkxp-z macOS engine is cached by its pinned commit + build script, so it is compiled once, not per run.

# Builds the desktop app (desktop/) and its installers, with the engines AceArcade bundles:
#   Windows: EasyRPG Player (RPG Maker 2000/2003), Ruffle (Flash)
#   macOS:   EasyRPG Player, Ruffle, Godot 4.7 (Godot games exported for Windows, from their .pck), mkxp-z (RPG Maker XP/VX/Ace)
# Games that ship their own Windows program (RPG Maker XP/VX/Ace Game.exe, MV/MZ, Ren'Py, Unity…) run natively on Windows.
on:
  push:
    branches: [ main, master, 'overhaul*' ]
    tags: [ 'desktop-v*' ]
    paths: [ 'desktop/**', 'ci/desktop/**', 'app/src/main/java/com/acecore/app/core/detection/**', 'app/src/main/java/com/acecore/app/core/model/**', 'app/src/main/java/com/acecore/app/core/scripts/**', '.github/workflows/desktop.yml' ]
  workflow_dispatch:
    inputs:
      platforms:
        description: Which desktop apps to build
        type: choice
        options: [ both, windows, macos ]
        default: both
      release_tag:
        description: Publish the zips as a pre-release with this tag (empty = artifacts only)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}

env:
  EASYRPG_VERSION: 0.8.1.1
  MKXPZ_COMMIT: 37a04d14413454551a7b6aadbb4e93e67168accb
  GODOT_VERSION: 4.7-stable

jobs:
  test:
    name: Desktop unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          # Development happens on branches, not only main: let pushes write the dependency/build cache too.
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Test
        run: chmod +x gradlew ci/run-gradle.sh && GRADLE_LOG=desktop-test.log ci/run-gradle.sh :desktop:test
      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in sorted(glob.glob("desktop/build/test-results/test/*.xml")):
              r = ET.parse(f).getroot()
              print(f"::notice title={r.get('name').split('.')[-1]}::{r.get('tests')} tests, {int(r.get('failures'))+int(r.get('errors'))} failed")
              for tc in r.iter('testcase'):
                  for fl in list(tc.findall('failure')) + list(tc.findall('error')):
                      print(f"::error title={tc.get('name')}::{(fl.get('message') or '')[:300]}")
          PY

  windows:
    name: Windows portable zip
    needs: test
    if: startsWith(github.ref, 'refs/tags/desktop-v') || (github.event_name == 'workflow_dispatch' && inputs.platforms != 'macos')
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          # Development happens on branches, not only main: let pushes write the dependency/build cache too.
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Bundle engines (EasyRPG Player, Ruffle)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          R=desktop/resources/windows/runtimes
          mkdir -p $R/easyrpg $R/ruffle
          curl -sSL -o easyrpg.zip "https://easyrpg.org/downloads/player/$EASYRPG_VERSION/easyrpg-player-$EASYRPG_VERSION-windows-x64.zip"
          unzip -q easyrpg.zip -d $R/easyrpg
          A=$(gh release view --repo ruffle-rs/ruffle --json assets -q '.assets[].name' | grep -i 'windows-x86_64.zip$' | head -1)
          gh release download --repo ruffle-rs/ruffle --pattern "$A" --output ruffle.zip
          unzip -q ruffle.zip -d $R/ruffle
          echo "::notice title=engines::EasyRPG $EASYRPG_VERSION, $A"
          find $R -maxdepth 3 -iname '*.exe' | head
      - name: Engine launch tests (EasyRPG, Ruffle)
        continue-on-error: true
        shell: bash
        run: bash ci/desktop/engine-launch-tests.sh windows "$PWD/desktop/resources/windows/runtimes" "$RUNNER_TEMP/enginetest"
      - name: Build portable app
        shell: bash
        run: |
          set -e
          GRADLE_LOG=win.log bash ci/run-gradle.sh :desktop:createDistributable
          ls desktop/build/compose/binaries/main/app/AceArcade
          test -f desktop/build/compose/binaries/main/app/AceArcade/AceArcade.exe
      # Optional: Microsoft's Azure Trusted Signing (gains SmartScreen reputation fastest).
      - name: Sign with Azure Trusted Signing
        if: env.AZURE_SIGNING_ACCOUNT != ''
        uses: azure/trusted-signing-action@1d365fec12862c4aa68fcac418143d73f0cea293 # v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: desktop/build/compose/binaries/main/app/AceArcade
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Sign and zip
        shell: bash
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          SIGNED_BY_AZURE: ${{ env.AZURE_SIGNING_ACCOUNT != '' && '1' || '' }}
        run: |
          set -e
          V=$(grep -m1 'appVersion *=' desktop/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          mkdir -p dist
          bash ci/desktop/windows-sign.sh desktop/build/compose/binaries/main/app/AceArcade "$GITHUB_WORKSPACE/dist/AceArcade-v$V-Windows-x64.zip"
          ls -l dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AceArcade-windows
          path: dist/*.zip
          retention-days: 14

  mkxpz-macos:
    name: mkxp-z engine (macOS, RPG Maker XP/VX/Ace)
    needs: test
    if: startsWith(github.ref, 'refs/tags/desktop-v') || (github.event_name == 'workflow_dispatch' && inputs.platforms != 'windows')
    runs-on: macos-latest
    timeout-minutes: 60
    outputs:
      ok: ${{ steps.launch.outcome == 'success' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: mkxpz-out
          key: mkxpz-macos-arm64-${{ env.MKXPZ_COMMIT }}-${{ hashFiles('ci/desktop/build-mkxpz-macos.sh') }}
      - name: Build mkxp-z
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash ci/desktop/build-mkxpz-macos.sh "$PWD/mkxpz-out"
      - name: Save the engine build (even if the launch test fails)
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: mkxpz-out
          key: ${{ steps.cache.outputs.cache-primary-key }}
      # Only an engine that really ran a game ships. If the test fails, the macOS app is still built, without mkxp-z,
      # and AceArcade says RPG Maker XP/VX/Ace isn't available on this Mac (no broken engine is bundled).
      - name: Launch test (runs a generated RPG Maker XP game)
        id: launch
        continue-on-error: true
        run: |
          EXE=$(ls "$PWD"/mkxpz-out/mkxp-z.* | grep -v '\.txt$' | head -1)
          echo "::notice title=mkxp-z::$(cat mkxpz-out/ACEARCADE-BUILD.txt)"
          bash ci/desktop/mkxpz-launch-test.sh "$EXE" "$RUNNER_TEMP"
      - name: Pack (keeps file permissions)
        if: steps.launch.outcome == 'success'
        run: tar -czf mkxpz-macos.tar.gz -C mkxpz-out .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.launch.outcome == 'success'
        with:
          name: mkxpz-macos
          path: mkxpz-macos.tar.gz
          retention-days: 7

  macos:
    name: macOS portable zip
    needs: [ test, mkxpz-macos ]
    if: always() && needs.test.result == 'success' && needs.mkxpz-macos.result == 'success'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          # Development happens on branches, not only main: let pushes write the dependency/build cache too.
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.mkxpz-macos.outputs.ok == 'true'
        with: { name: mkxpz-macos }
      - name: Bundle engines (EasyRPG Player, Ruffle, Godot, mkxp-z)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          R=desktop/resources/macos/runtimes
          mkdir -p $R/easyrpg $R/ruffle $R/godot
          if [ -f mkxpz-macos.tar.gz ]; then mkdir -p $R/mkxpz && tar -xzf mkxpz-macos.tar.gz -C $R/mkxpz
          else echo "::warning title=mkxp-z not bundled::its launch test failed, so RPG Maker XP/VX/Ace games are reported as unavailable in this macOS build"; fi
          curl -sSL -o easyrpg.zip "https://easyrpg.org/downloads/player/$EASYRPG_VERSION/easyrpg-player-$EASYRPG_VERSION-macos.app.zip"
          ditto -x -k easyrpg.zip $R/easyrpg
          A=$(gh release view --repo ruffle-rs/ruffle --json assets -q '.assets[].name' | grep -i 'macos-universal.tar.gz$' | head -1)
          gh release download --repo ruffle-rs/ruffle --pattern "$A" --output ruffle.tar.gz
          tar -xzf ruffle.tar.gz -C $R/ruffle
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION/Godot_v${GODOT_VERSION}_macos.universal.zip"
          ditto -x -k godot.zip $R/godot
          echo "::notice title=engines::EasyRPG $EASYRPG_VERSION, $A, Godot $GODOT_VERSION, mkxp-z ${MKXPZ_COMMIT:0:7}"
          ls -la $R/*
      - name: Engine launch tests (EasyRPG, Godot, Ruffle)
        continue-on-error: true
        run: bash ci/desktop/engine-launch-tests.sh macos "$PWD/desktop/resources/macos/runtimes" "$RUNNER_TEMP/enginetest"
      - name: Build, sign, notarize and zip
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -e
          chmod +x gradlew && GRADLE_LOG=mac.log bash ci/run-gradle.sh :desktop:createDistributable
          D=desktop/build/compose/binaries/main/app
          test -x $D/AceArcade.app/Contents/MacOS/AceArcade
          V=$(grep -m1 'appVersion *=' desktop/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          mkdir -p dist
          bash ci/desktop/macos-sign.sh $D/AceArcade.app "$PWD/dist/AceArcade-v$V-macOS-$(uname -m).zip"
          ls -l dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AceArcade-macos
          path: dist/*.zip
          retention-days: 14

  publish:
    name: Publish zips
    needs: [ windows, macos ]
    # Publishes whatever was built and verified; a platform that failed is reported, not silently dropped.
    if: always() && (startsWith(github.ref, 'refs/tags/desktop-v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')) && (needs.windows.result == 'success' || needs.macos.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: release-${{ inputs.release_tag || github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { sparse-checkout: ci }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { pattern: AceArcade-*, path: dist, merge-multiple: true }
      - name: Checksums and missing-platform report
        run: |
          ls -l dist
          for p in windows macos; do
            r=$([ $p = windows ] && echo "${{ needs.windows.result }}" || echo "${{ needs.macos.result }}")
            [ "$r" = success ] || echo "::warning title=Incomplete release::$p build $r - not included"
          done
          V=$(ls dist/*.zip | head -1 | sed -n 's/.*AceArcade-v\([0-9.]*\)-.*/\1/p')
          ( cd dist && sha256sum *.zip > "AceArcade-v$V-desktop-checksums.sha256" && cat *.sha256 )
      - name: Create or update the release (idempotent; safe to re-run)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: '1'
          NOTES: "Portable Windows and macOS apps (unzip and run, no installer). SHA-256 checksums attached."
        run: bash ci/release-publish.sh "${{ inputs.release_tag || github.ref_name }}" "AceArcade desktop ${{ inputs.release_tag || github.ref_name }}" dist/*
